# Console d'exploration de payment-service (profil "tools", publiée sur 127.0.0.1 uniquement).
# Donne accès au Swagger de la plateforme de paiement sans publier payment-service lui-même.
server {
    listen 80;
    server_name _;

    # Redirections relatives : nginx écoute sur 80 dans le conteneur, mais le navigateur passe par 8082
    absolute_redirect off;

    # DNS interne de Docker, interrogé à chaque requête : suit payment-service s'il est recréé
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = / {
        return 302 /api/payment/docs;
    }

    location /api/payment/ {
        set $payment_service http://payment-service:8000;
        proxy_pass $payment_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
