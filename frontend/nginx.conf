# nginx sert la SPA et fait office de passerelle API (reverse proxy) vers les microservices.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # DNS interne de Docker, interrogé à chaque requête (cache de 5 s) : quand un service est recréé
    # (redéploiement, remédiation), il change d'IP. Avec un nom fixe dans proxy_pass, nginx garderait
    # l'ancienne IP résolue au démarrage et l'API resterait injoignable alors que le conteneur est sain.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Les chemins sont transmis tels quels : chaque service expose déjà son préfixe
    # (proxy_pass avec une variable et sans URI transmet l'URI d'origine).
    # payment-service n'est volontairement pas routé : seul shop-service peut l'appeler.
    location /api/auth/ {
        set $auth_service http://auth-service:8000;
        proxy_pass $auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/shop/ {
        set $shop_service http://shop-service:8000;
        proxy_pass $shop_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routage côté client (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
