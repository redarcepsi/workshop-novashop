name: novashop

# ---------------------------------------------------------------------------
# Plateforme de paiement fictive et sa boutique marchande de démonstration, NovaShop
#
#   frontend (nginx)  ── SPA React + passerelle /api/*            SEUL service publié (port 8080)
#   auth-service      ── comptes clients NovaShop, JWT
#   shop-service      ── NovaShop (marchand) : catalogue, panier, commandes
#   payment-service   ── plateforme de paiement : transactions, remboursements, journal
#   postgres          ── une instance, une base + un rôle par service
#
# Réseaux (un service ne voit que ceux dont il a besoin) :
#   edge       nginx seul : porte le port publié
#   frontend   nginx ↔ auth-service, shop-service      internal
#   payment    shop-service ↔ payment-service          internal
#   backend    auth-service, shop-service ↔ postgres   internal
#   payment-db payment-service ↔ postgres               internal
# Un réseau "internal" n'a pas de route vers l'extérieur : seul nginx peut sortir du réseau Docker.
#
# Ni la base ni les API ne sont publiées sur l'hôte : on ne peut atteindre que la passerelle nginx,
# sur l'adresse HTTP_BIND (le jour J : 192.168.137.1, le point d'accès du consortium, pour ne pas
# l'exposer aussi sur le Wi-Fi du campus). payment-service n'est joignable que par shop-service
# (et, avec le profil "tools", par sa console d'exploration publiée sur 127.0.0.1).
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Utilisés par db/init/01-init-databases.sh pour créer une base + un rôle par service
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:-shop_password}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 : le serveur temporaire lancé pendant l'init n'écoute pas en TCP,
      # le healthcheck ne passe donc au vert qu'une fois les bases créées.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d shop_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
      - payment-db

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://auth_user:${AUTH_DB_PASSWORD:-auth_password}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend

  shop-service:
    build: ./services/shop-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://shop_user:${SHOP_DB_PASSWORD:-shop_password}@postgres:5432/shop_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      PAYMENT_SERVICE_URL: http://payment-service:8000
      PAYMENT_API_KEY: ${MERCHANT_API_KEY:-sk_test_novashop_dev_only_change_me}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-50.00}
      SHIPPING_COST: ${SHIPPING_COST:-4.90}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    # Volontairement pas de dépendance sur payment-service : si le paiement tombe, la boutique
    # reste consultable (mode dégradé) et le paiement répond 503 sans rien débiter.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend
      - payment

  payment-service:
    build: ./services/payment-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://payment_user:${PAYMENT_DB_PASSWORD:-payment_password}@postgres:5432/payment_db
      # Clé API du marchand NovaShop : seul son hash SHA-256 est stocké en base
      MERCHANT_API_KEY: ${MERCHANT_API_KEY:-sk_test_novashop_dev_only_change_me}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - payment-db
      - payment

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      shop-service:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    networks:
      - edge
      - frontend

  # Interface web d'admin Postgres (optionnelle) : docker compose --profile tools up -d
  # Publiée sur 127.0.0.1 uniquement : invisible depuis le réseau du consortium.
  adminer:
    image: adminer:4
    profiles: ["tools"]
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - backend
      - tools

  # Console d'exploration de payment-service (optionnelle) : docker compose --profile tools up -d
  # → http://127.0.0.1:8082 (Swagger). payment-service reste non publié et sans accès extérieur :
  # seul ce proxy, sur 127.0.0.1, l'atteint en dehors de shop-service.
  payment-console:
    image: nginx:1.27-alpine
    profiles: ["tools"]
    depends_on:
      - payment-service
    volumes:
      - ./tools/payment-console.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - payment
      - tools

  # ---------------------------------------------------------------------------
  # Assistant documentaire des opérateurs (pilier IA), profil "ai" :
  #   docker compose --profile ai up -d        → port 8083, publié comme le site (HTTP_BIND)
  #   (+ -f docker-compose.gpu.yml pour utiliser une carte NVIDIA)
  #
  #   ollama         ── modèles locaux gemma4:e4b (7,5 Md de paramètres) et embeddinggemma, non publié
  #   ollama-models  ── télécharge les modèles absents au lancement, puis s'arrête
  #   rag-service    ── LangChain : indexe documents/ dans Chroma, répond en citant ses sources
  #   assistant-ui   ── interface de chat Streamlit, publiée sur la même interface que le site
  #
  # L'assistant aide à comprendre, il n'agit pas : aucun accès au socket Docker ni aux réseaux de la
  # plateforme, documents montés en lecture seule, fichiers joints au chat lus en mémoire sans être
  # enregistrés. La remédiation reste le travail de l'automate.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.35.1
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      # Garde les modèles chargés : pas de temps de chargement à la première question de la démo
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Une requête à la fois : la mémoire du PC Hôte est partagée avec toute la stack
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai
      - ai-egress

  ollama-models:
    image: ollama/ollama:0.35.1
    profiles: ["ai"]
    restart: "no"
    # "show" fonctionne hors ligne : une fois les modèles présents, la stack redémarre sans Internet
    entrypoint:
      - /bin/sh
      - -c
      - for m in "$$LLM_MODEL" "$$EMBEDDING_MODEL"; do ollama show "$$m" >/dev/null 2>&1 || ollama pull "$$m" || exit 1; done
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:latest}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai

  rag-service:
    build: ./services/rag-service
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:latest}
      LLM_THINK: ${LLM_THINK:-true}
      RAG_API_KEY: ${RAG_API_KEY:-rag_dev_only_change_me}
    volumes:
      # Déposer les fichiers dans documents/ : ils sont indexés en moins de 30 s, sans redémarrage
      - ./documents:/data/documents:ro
      - ./README.md:/data/project/README.md:ro
      - rag-index:/data/chroma
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    networks:
      - ai

  # Interface de chat Streamlit : une conversation, des fichiers joints, rien d'autre. Sans compte ni
  # historique enregistré (rien sur disque). Publiée comme le site, sur HTTP_BIND (le jour J, le seul point
  # d'accès du consortium) : tout poste de ce réseau peut l'interroger. ASSISTANT_BIND=127.0.0.1 la réserve
  # au PC Hôte. Elle n'atteint que rag-service, avec la clé partagée. Ni Ollama, ni web, ni exécution de code
  assistant-ui:
    build: ./services/assistant-ui
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      RAG_SERVICE_URL: http://rag-service:8000/api/rag/v1
      RAG_API_KEY: ${RAG_API_KEY:-rag_dev_only_change_me}
    depends_on:
      - rag-service
    ports:
      - "${ASSISTANT_BIND:-${HTTP_BIND:-0.0.0.0}}:${ASSISTANT_PORT:-8083}:8501"
    networks:
      - ai
      - assistant-edge

networks:
  edge:
  frontend:
    internal: true
  payment:
    internal: true
  backend:
    internal: true
  payment-db:
    internal: true
  tools:
  # Assistant IA : rag-service n'a aucune route vers l'extérieur ; seul Ollama sort (téléchargement des
  # modèles) et seule l'interface porte un port publié
  ai:
    internal: true
  ai-egress:
  assistant-edge:

volumes:
  pgdata:
  ollama-models:
  rag-index:
