name: novashop

# ---------------------------------------------------------------------------
# Plateforme de paiement fictive et sa boutique marchande de démonstration, NovaShop
#
#   frontend (nginx)  ── SPA React + passerelle /api/*            SEUL service publié (port 8080)
#   auth-service      ── comptes clients NovaShop, JWT
#   shop-service      ── NovaShop (marchand) : catalogue, panier, commandes
#   payment-service   ── plateforme de paiement : transactions, remboursements, journal
#   postgres          ── une instance, une base + un rôle par service
#
# Réseaux (un service ne voit que ceux dont il a besoin) :
#   edge       nginx seul : porte le port publié
#   frontend   nginx ↔ auth-service, shop-service      internal
#   payment    shop-service ↔ payment-service          internal
#   backend    auth-service, shop-service ↔ postgres   internal
#   payment-db payment-service ↔ postgres               internal
# Un réseau "internal" n'a pas de route vers l'extérieur : seul nginx peut sortir du réseau Docker.
#
# Ni la base ni les API ne sont publiées sur l'hôte : on ne peut atteindre que la passerelle nginx,
# sur l'adresse HTTP_BIND (le jour J : l'adresse de la VM sur le point d'accès du consortium, pour ne pas
# l'exposer sur ses autres interfaces). payment-service n'est joignable que par shop-service
# (et, avec le profil "tools", par sa console d'exploration publiée sur 127.0.0.1).
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Utilisés par db/init/01-init-databases.sh pour créer une base + un rôle par service
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:-shop_password}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 : le serveur temporaire lancé pendant l'init n'écoute pas en TCP,
      # le healthcheck ne passe donc au vert qu'une fois les bases créées.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d shop_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
      - payment-db

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://auth_user:${AUTH_DB_PASSWORD:-auth_password}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend

  shop-service:
    build: ./services/shop-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://shop_user:${SHOP_DB_PASSWORD:-shop_password}@postgres:5432/shop_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      PAYMENT_SERVICE_URL: http://payment-service:8000
      PAYMENT_API_KEY: ${MERCHANT_API_KEY:-sk_test_novashop_dev_only_change_me}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-50.00}
      SHIPPING_COST: ${SHIPPING_COST:-4.90}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    # Volontairement pas de dépendance sur payment-service : si le paiement tombe, la boutique
    # reste consultable (mode dégradé) et le paiement répond 503 sans rien débiter.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend
      - payment

  payment-service:
    build: ./services/payment-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://payment_user:${PAYMENT_DB_PASSWORD:-payment_password}@postgres:5432/payment_db
      # Clé API du marchand NovaShop : seul son hash SHA-256 est stocké en base
      MERCHANT_API_KEY: ${MERCHANT_API_KEY:-sk_test_novashop_dev_only_change_me}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - payment-db
      - payment

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      shop-service:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    networks:
      - edge
      - frontend

  # Interface web d'admin Postgres (optionnelle) : docker compose --profile tools up -d
  # Publiée sur 127.0.0.1 uniquement : invisible depuis le réseau du consortium.
  adminer:
    image: adminer:4
    profiles: ["tools"]
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - backend
      - tools

  # Console d'exploration de payment-service (optionnelle) : docker compose --profile tools up -d
  # → http://127.0.0.1:8082 (Swagger). payment-service reste non publié et sans accès extérieur :
  # seul ce proxy, sur 127.0.0.1, l'atteint en dehors de shop-service.
  payment-console:
    image: nginx:1.27-alpine
    profiles: ["tools"]
    depends_on:
      - payment-service
    volumes:
      - ./tools/payment-console.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - payment
      - tools

  # ---------------------------------------------------------------------------
  # Assistant documentaire des opérateurs (pilier IA), profil "ai" :
  #   docker compose --profile ai up -d        → port 8083, publié comme le site (HTTP_BIND)
  #   (+ -f docker-compose.gpu.yml pour utiliser une carte NVIDIA)
  #
  #   ollama         ── modèles locaux gemma4:e4b (7,5 Md de paramètres) et embeddinggemma, non publié
  #   ollama-models  ── télécharge les modèles absents au lancement, puis s'arrête
  #   rag-service    ── LangChain : indexe documents/ dans Chroma, répond en citant ses sources
  #   assistant-ui   ── interface de chat Streamlit, publiée sur la même interface que le site
  #
  # L'assistant aide à comprendre, il n'agit pas : aucun accès au socket Docker ni aux réseaux de la
  # plateforme, documents montés en lecture seule, fichiers joints au chat lus en mémoire sans être
  # enregistrés. La remédiation reste le travail de l'automate.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.35.1
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      # Modèles jamais déchargés (-1) : sur processeur, recharger gemma4 prend plus de 3 minutes, que paierait
      # la première question après une pause
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      # Une requête à la fois : la mémoire de la VM est partagée avec toute la stack
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai
      - ai-egress

  ollama-models:
    image: ollama/ollama:0.35.1
    profiles: ["ai"]
    restart: "no"
    # "show" fonctionne hors ligne : une fois les modèles présents, la stack redémarre sans Internet
    entrypoint:
      - /bin/sh
      - -c
      - for m in "$$LLM_MODEL" "$$EMBEDDING_MODEL"; do ollama show "$$m" >/dev/null 2>&1 || ollama pull "$$m" || exit 1; done
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:latest}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai

  rag-service:
    build: ./services/rag-service
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:latest}
      LLM_THINK: ${LLM_THINK:-true}
      RAG_API_KEY: ${RAG_API_KEY:-rag_dev_only_change_me}
    volumes:
      # Déposer les fichiers dans documents/ : ils sont indexés en moins de 30 s, sans redémarrage
      - ./documents:/data/documents:ro
      - ./README.md:/data/project/README.md:ro
      - rag-index:/data/chroma
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    networks:
      - ai

  # Interface de chat Streamlit : une conversation, des fichiers joints, rien d'autre. Sans compte ni
  # historique enregistré (rien sur disque). Publiée comme le site, sur HTTP_BIND (le jour J, le seul point
  # d'accès du consortium) : tout poste de ce réseau peut l'interroger. ASSISTANT_BIND=127.0.0.1 la réserve
  # à la VM. Elle n'atteint que rag-service, avec la clé partagée. Ni Ollama, ni web, ni exécution de code
  assistant-ui:
    build: ./services/assistant-ui
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      RAG_SERVICE_URL: http://rag-service:8000/api/rag/v1
      RAG_API_KEY: ${RAG_API_KEY:-rag_dev_only_change_me}
    depends_on:
      - rag-service
    ports:
      - "${ASSISTANT_BIND:-${HTTP_BIND:-0.0.0.0}}:${ASSISTANT_PORT:-8083}:8501"
    networks:
      - ai
      - assistant-edge

  # ---------------------------------------------------------------------------
  # Supervision, profil "monitoring" : alimente Prometheus, Loki et Grafana, lancés dans leur propre compose sur la
  # même VM et branchés sur le réseau monitoring-edge (réseau externe novashop_monitoring-edge de leur côté).
  #   docker compose --profile monitoring up -d        → port 9464 sur METRICS_BIND (par défaut 127.0.0.1)
  #
  #   metrics-gateway      ── point d'entrée unique des métriques, protégé par le jeton METRICS_TOKEN :
  #                           /metrics/auth, /metrics/shop, /metrics/payment, /metrics/rag, /metrics/nginx
  #   nginx-exporter       ── convertit les compteurs de nginx (stub_status, port 8081 du frontend) pour Prometheus
  #   log-shipper          ── Grafana Alloy : envoie les journaux de tous les conteneurs à Loki (LOKI_URL)
  #   docker-socket-proxy  ── API Docker en lecture seule pour log-shipper : liste et journaux des conteneurs
  #
  # Chaque API expose /metrics hors de son préfixe /api/<service> : nginx ne la relaie pas, seule la passerelle
  # l'atteint. Celle-ci rejoint les réseaux existants, comme payment-console, plutôt qu'un réseau commun à tous les
  # services qui permettrait à chacun de joindre les autres (auth-service → payment-service…).
  # Côté supervision : monitoring/prometheus-scrape.example.yml
  # ---------------------------------------------------------------------------
  metrics-gateway:
    image: nginx:1.27-alpine
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-metrics_dev_only_change_me}
      NGINX_ENVSUBST_FILTER: ^METRICS_
    volumes:
      - ./monitoring/metrics-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    # Prometheus est sur la même VM : le port ne sert qu'aux tests (curl) et à un Prometheus installé hors de Docker
    ports:
      - "${METRICS_BIND:-127.0.0.1}:${METRICS_PORT:-9464}:80"
    networks:
      - frontend          # auth-service, shop-service, nginx-exporter
      - payment           # payment-service
      - ai                # rag-service
      - monitoring-edge

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://frontend:8081/stub_status"]
    networks:
      - frontend

  # Le socket Docker donne le contrôle de l'hôte : log-shipper n'y accède qu'à travers ce proxy, qui refuse toute
  # écriture (POST=0 par défaut) et toute autre section de l'API que les conteneurs et les réseaux (lus par la
  # découverte d'Alloy pour étiqueter les conteneurs)
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  log-shipper:
    image: grafana/alloy:v1.8.3
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      # Ex. http://loki:3100/loki/api/v1/push (Loki de la supervision, branché sur monitoring-edge)
      LOKI_URL: ${LOKI_URL:-}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Position de lecture de chaque journal : un redémarrage ne renvoie pas tout l'historique à Loki
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - docker-socket-proxy
    networks:
      - docker-api
      - monitoring-edge

networks:
  edge:
  frontend:
    internal: true
  payment:
    internal: true
  backend:
    internal: true
  payment-db:
    internal: true
  tools:
  # Assistant IA : rag-service n'a aucune route vers l'extérieur ; seul Ollama sort (téléchargement des
  # modèles) et seule l'interface porte un port publié
  ai:
    internal: true
  ai-egress:
  assistant-edge:
  # Supervision : Prometheus et Loki (compose de la supervision) s'y branchent sous le nom novashop_monitoring-edge
  # pour joindre metrics-gateway et recevoir les journaux de log-shipper. Non internal : il porte le port 9464 et
  # laisse log-shipper joindre un Loki installé hors de Docker. L'API Docker reste interne
  monitoring-edge:
  docker-api:
    internal: true

volumes:
  pgdata:
  ollama-models:
  rag-index:
  alloy-data:
